<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-powered Content Summarizer • Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React and ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    /* 3D Flip Card Animation Styles */
    .perspective {
      perspective: 1000px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    /* Pulsating audio viz bars */
    @keyframes bounce {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }
    .anim-viz-1 { animation: bounce 0.8s ease-in-out infinite alternate; }
    .anim-viz-2 { animation: bounce 1.1s ease-in-out infinite alternate; }
    .anim-viz-3 { animation: bounce 0.9s ease-in-out infinite alternate; }
    .anim-viz-4 { animation: bounce 1.3s ease-in-out infinite alternate; }
    .anim-viz-5 { animation: bounce 0.7s ease-in-out infinite alternate; }
    .anim-viz-6 { animation: bounce 1.2s ease-in-out infinite alternate; }
    .anim-viz-7 { animation: bounce 1.0s ease-in-out infinite alternate; }
    .anim-viz-8 { animation: bounce 1.4s ease-in-out infinite alternate; }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#030712',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500/30 selection:text-cyan-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Default Fallback Mock Data to demonstrate full interactive experience immediately
    const MOCK_SUMMARIES = [
      {
        id: 1001,
        title: "Introduction to Artificial Neural Networks",
        inputContent: "Demystifying Artificial Neural Networks (ANNs)",
        category: "Technical",
        summaryText: "Artificial Neural Networks (ANNs) are computational paradigms inspired directly by biological mammalian brain structures. At their core, they consist of artificial nodes (neurons) grouped into input, hidden, and output operational layers. Individual synapses contain mathematical weight coefficients adjusted iteratively during empirical training matrices. Backpropagation feeds loss errors backwards, calibrating gradients dynamically to map complex high-dimensional non-linear functions.",
        keyPoints: [
          "Inspired model architecture mirroring biological neurological pathways.",
          "Constructed of layered computational nodes carrying configurable weight multipliers.",
          "Trained through loss function backpropagation error corrective vectors."
        ],
        keywords: ["Neural Networks", "Gradient Descent", "Backpropagation", "Machine Learning"],
        simplifiedExplanation: "Imagine a giant crew of assistants in a line guessing the weight of an exotic fruit. The first assistant passes a guess down the line. If the final guess is wrong, a feedback manager walks backward telling each assistant exactly how far off they were and how to adjust their judgment next time. Over several thousand fruits, the crew gets incredibly accurate.",
        actionableInsights: [
          "Examine weight distribution values in deep networks to trace feature extraction.",
          "Apply regularization multipliers (L1/L2) to prevent neurological over-fitting."
        ],
        smartHighlights: [
          { text: "ANNs consist of artificial nodes grouped into input, hidden, and output layers.", type: "concept" },
          { text: "Adjust weight multipliers iteratively to map high-complexity non-linear functions.", type: "action" }
        ],
        sentiment: "Neutral",
        suggestedTopics: ["Convolutional Neural Networks (CNNs)", "Heuristics of Optimizer Functions", "Stochastic Gradient Descent"],
        timestamp: Date.now() - 3600000 * 2,
        mode: "BULLET SUMMARY",
        language: "English",
        difficulty: "Intermediate",
        flashcards: [
          { front: "What is backpropagation in an ANN?", back: "The process of sending error scores backward through the network's layers to update synaptical weight weights." },
          { front: "Name the three standard layers of a basic ANN model", back: "Input Layer, Hidden Layer, and Output Layer." }
        ],
        quizQuestions: [
          {
            question: "Which algorithmic process adjusts the nodes values backward to shrink predictive error margins?",
            options: ["Backpropagation", "Linear Regression", "Dimensionality Reduction", "Activation Clipping"],
            correctIndex: 0,
            explanation: "Backpropagation calculates loss gradients of weights relative to the target result, propagating error levels back to optimize network coefficients."
          }
        ]
      }
    ];

    function App() {
      const [summaries, setSummaries] = useState(() => {
        const stored = localStorage.getItem("AI_SUMMARIST_STORE");
        return stored ? JSON.parse(stored) : MOCK_SUMMARIES;
      });

      const [prefKey, setPrefKey] = useState(() => localStorage.getItem("GEMINI_KEY_PERSIST") || "");
      const [activeScreen, setActiveScreen] = useState("dashboard"); // dashboard, preferences, deconstructor
      const [selectedSummary, setSelectedSummary] = useState(null);

      // Input form states
      const [inputMode, setInputMode] = useState(0); // 0=Copied Text, 1=YouTube Link, 2=Doc Topic
      const [rawText, setRawText] = useState("");
      const [youtubeUrl, setYoutubeUrl] = useState("");
      const [docTopic, setDocTopic] = useState("");
      const [selectedLanguage, setSelectedLanguage] = useState("English");
      const [selectedStyle, setSelectedStyle] = useState("BULLET SUMMARY");
      const [selectedDifficulty, setSelectedDifficulty] = useState("Intermediate");
      const [customInstructions, setCustomInstructions] = useState("");

      // Status notifications
      const [isLoading, setIsLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState("");
      const [errorMsg, setErrorMsg] = useState("");
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);

      // Save database sync
      useEffect(() => {
        localStorage.setItem("AI_SUMMARIST_STORE", JSON.stringify(summaries));
      }, [summaries]);

      useEffect(() => {
        localStorage.setItem("GEMINI_KEY_PERSIST", prefKey);
      }, [prefKey]);

      // Handle custom summarization
      const triggerSummarize = async () => {
        let content = "";
        if (inputMode === 0) content = rawText;
        else if (inputMode === 1) content = `Summarize YouTube Transcript for URL: ${youtubeUrl}. Subtitle Topic constraint: ${rawText}`;
        else content = `Create high fidelity learning resource summary about the topic: ${docTopic}. Raw detail outline: ${rawText}`;

        if (!content.trim()) {
          setErrorMsg("Please enter text content, specify the video details or enter a topic map.");
          return;
        }

        setErrorMsg("");
        setIsLoading(true);
        setStatusMsg("Synthesizing Knowledge Node with Gemini 1.5 Flash...");

        try {
          if (!prefKey) {
            // Trigger local mock simulation or guide input key
            setShowApiKeyModal(true);
            setIsLoading(false);
            return;
          }

          const systemInstructions = `
            You are an expert Content Deconstruction & AI Learning Assistant. Your goal is to analyze the input content and output a completely structured JSON representation of its summary, deconstructed notes, and interactive learning elements.
            
            Depending on the summary mode chosen by the user, adjust your tone, format, and depth of details:
            - "SHORT SUMMARY": A super brief 2-5 line high impact concise overview.
            - "BULLET SUMMARY": Core essential details structured into precise, beautiful bullet points.
            - "STUDENT NOTES": Exam-oriented, syllabus-style note format with key definitions, concepts, and prospective oral/interview questions.
            - "BEGINNER EXPLANATION": Teach like the reader is an absolute novice. Use extremely simple analogies, paint vivid mental pictures, and fully exclude technical jargon.
            - "PROFESSIONAL": A formal, business-oriented executive brief, centering high level operations and objectives.
            - "STORY STYLE": Transform the material into an engaging narrative storytelling story, showing instead of just telling.
            - "SOCIAL MEDIA": Convert facts into a highly clickable multi-part format (e.g., a Twitter/X thread format, LinkedIn executive snippet, or Instagram visual captions).
            
            You MUST output a valid, parsable JSON object exactly matching the schema below. Keep formatting neat and use correct escapes:
            {
              "title": "A compelling, clear title based on the content",
              "category": "Pick exactly one: Educational / Technical / Medical / Business / News / Research / Entertainment",
              "summaryText": "The actual full summary based on the requested mode",
              "keyPoints": ["Bullet point 1", "Bullet point 2", "..."],
              "keywords": ["keyword1", "keyword2", "..."],
              "simplifiedExplanation": "Explanatory teach-in of difficult concepts for complete beginners.",
              "actionableInsights": ["Action 1", "Action 2", "..."],
              "smartHighlights": [
                {
                  "text": "precise quote or sentence from original text to highlight",
                  "type": "concept"
                }
              ],
              "sentiment": "Pick exactly one: Positive / Negative / Neutral",
              "suggestedTopics": ["Follow-up learning topic 1", "Topic 2", "..."],
              "flashcards": [
                {
                  "front": "Front of card (Concept or Question)",
                  "back": "Back of card (Exact explanation or answer)"
                }
              ],
              "quizQuestions": [
                {
                  "question": "A multiple choice question testing understanding",
                  "options": ["Option A", "Option B", "Option C", "Option D"],
                  "correctIndex": 0,
                  "explanation": "Detailed explanation of correct answer"
                }
              ]
            }
            Do NOT include markdown fencing (like \`\`\`json) in your answer. Return ONLY raw JSON text.
          `;

          const fullPrompt = `
            ${systemInstructions}

            Input Content:
            ---
            ${content}
            ---

            Preferences:
            - Mode: ${selectedStyle}
            - Language: ${selectedLanguage}
            - Vocabulary level: ${selectedDifficulty}
            - Custom guidance: ${customInstructions}
          `;

          const apiResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${prefKey}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: fullPrompt }]
              }],
              generationConfig: {
                responseMimeType: "application/json",
                temperature: 0.7
              }
            })
          });

          if (!apiResponse.ok) {
            throw new Error(`Gemini API Error: Status code ${apiResponse.status}`);
          }

          const apiJson = await apiResponse.json();
          const rawResponseText = apiJson.candidates[0].content.parts[0].text;
          const parsedResult = JSON.parse(rawResponseText);

          // Build item
          const newSummary = {
            id: Date.now(),
            title: parsedResult.title || "Untitled Summary",
            inputContent: content,
            category: parsedResult.category || "Educational",
            summaryText: parsedResult.summaryText || "No summary text generated.",
            keyPoints: parsedResult.keyPoints || [],
            keywords: parsedResult.keywords || [],
            simplifiedExplanation: parsedResult.simplifiedExplanation || "",
            actionableInsights: parsedResult.actionableInsights || [],
            smartHighlights: parsedResult.smartHighlights || [],
            sentiment: parsedResult.sentiment || "Neutral",
            suggestedTopics: parsedResult.suggestedTopics || [],
            timestamp: Date.now(),
            mode: selectedStyle,
            language: selectedLanguage,
            difficulty: selectedDifficulty,
            flashcards: parsedResult.flashcards || [],
            quizQuestions: parsedResult.quizQuestions || []
          };

          setSummaries(prev => [newSummary, ...prev]);
          setSelectedSummary(newSummary);
          setActiveScreen("deconstructor");
          setRawText("");
          setYoutubeUrl("");
          setDocTopic("");

        } catch (e) {
          console.error(e);
          setErrorMsg(`Failed to compile summary: ${e.message}. Please check if your API Key is valid and active.`);
        } finally {
          setIsLoading(false);
        }
      };

      const handleSimulateDemo = () => {
        // Quick visual simulation so users without API keys can immediately experience the high-fidelity UI
        const demoSum = {
          id: Date.now(),
          title: "Quantum Computing & Cryptography Risks",
          inputContent: "Demystifying Quantum Risks in modern cryptography standard frameworks",
          category: "Technical",
          summaryText: "Quantum computers pose an existential threat to modern cryptography. Standard algorithms like RSA and ECC rely on the extreme computational difficulty of integer factorization. Shor's algorithm, executed on a fault-tolerant quantum hardware array, solves factorization problems in polynomial time. Transitioning to Post-Quantum Cryptography (PQC) based on lattice structures represents an urgent engineering challenge.",
          keyPoints: [
            "Current public-key infrastructure relies on prime number factoring constraints.",
            "Shor's quantum algorithm can solve prime factoring in minutes instead of millennia.",
            "Lattice-based mathematical cryptography forms the prime basis for post-quantum defenses."
          ],
          keywords: ["Quantum Cryptography", "Shor's Algorithm", "RSA Encryption", "Lattice Cryptography"],
          simplifiedExplanation: "Imagine our current security lock is so complex that all combinations would take normal lockpickers a billion years to dial. A quantum computer acts like a liquid metal portal key that molds itself to the exact shape of lock pins simultaneously. To protect our secrets, we need to design entirely new locks based on multi-dimensional labyrinths instead of normal keys.",
          actionableInsights: [
            "Audit organization databases for quantum-vulnerable protocols.",
            "Upgrade key legacy nodes to lattice-based post-quantum key swaps."
          ],
          smartHighlights: [
            { text: "Shor's algorithm can solve factorization problems in polynomial time.", type: "concept" },
            { text: "Transitioning to quantum-resistant encryption parameters is urgent.", type: "action" }
          ],
          sentiment: "Negative",
          suggestedTopics: ["Post-Quantum Cryptography", "Lattice-Based Math", "NIST Encryption Standards"],
          timestamp: Date.now(),
          mode: "BULLET SUMMARY",
          language: "English",
          difficulty: "Advanced",
          flashcards: [
            { front: "What threat model does Shor's algorithm present to cryptography?", back: "It factorizes large prime numbers instantly, breaking standard public-private key schemes like RSA." },
            { front: "Name the leading cryptographical design pattern chosen by NIST to replace standard RSA.", back: "Lattice-based cryptography mathematical structures." }
          ],
          quizQuestions: [
            {
              question: "Which quantum algorithm is celebrated for factorizing big numbers exponentially faster?",
              options: ["Shor's Algorithm", "Grover's Search Model", "Dijkstra's Matrix Check", "Markov Matrix Walk"],
              correctIndex: 0,
              explanation: "Shor's algorithm runs on quantum setups in O(log N)^3 steps to decode large integer groups instantly."
            }
          ]
        };

        setSummaries(prev => [demoSum, ...prev]);
        setSelectedSummary(demoSum);
        setActiveScreen("deconstructor");
        setShowApiKeyModal(false);
      };

      const handleDeleteSummary = (id) => {
        setSummaries(prev => prev.filter(s => s.id !== id));
        if (selectedSummary?.id === id) {
          setSelectedSummary(null);
          setActiveScreen("dashboard");
        }
      };

      return (
        <div class="min-h-screen bg-slate-950 flex flex-col justify-between">
          
          {/* TOP GLOWING HEADER */}
          <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div class="flex items-center gap-3 cursor-pointer" onClick={() => setActiveScreen("dashboard")}>
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-cyan-500/10">
                  <span class="text-slate-950 font-black text-xl">S</span>
                </div>
                <div>
                  <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-cyan-300 via-teal-200 to-emerald-400 bg-clip-text text-transparent">
                    Summarist AI
                  </h1>
                  <p class="text-xs text-slate-500 font-medium">Next-Gen Content Deconstruction</p>
                </div>
              </div>

              {/* CONTROLS AREA */}
              <div class="flex items-center gap-2">
                <button 
                  onClick={() => setActiveScreen("dashboard")}
                  class={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${activeScreen === "dashboard" ? "bg-slate-905 text-cyan-400 border border-cyan-500/20" : "text-slate-400 hover:text-slate-200"}`}
                >
                  Dashboard
                </button>
                <button 
                  onClick={() => setActiveScreen("preferences")}
                  class={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${activeScreen === "preferences" ? "bg-slate-905 text-cyan-400 border border-cyan-500/20" : "text-slate-400 hover:text-slate-200"}`}
                >
                  AI Brain Prefs
                </button>
                
                {/* KEY CONFIG SECTOR */}
                <button 
                  onClick={() => setShowApiKeyModal(true)}
                  class={`flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-800 text-xs font-semibold ${prefKey ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" : "bg-cyan-500/10 text-cyan-400 border-cyan-500/20"} transition-all`}
                >
                  <span class="relative flex h-2 w-2">
                    <span class={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${prefKey ? "bg-emerald-400" : "bg-cyan-400"}`}></span>
                    <span class={`relative inline-flex rounded-full h-2 w-2 ${prefKey ? "bg-emerald-500" : "bg-cyan-500"}`}></span>
                  </span>
                  {prefKey ? "API Connection Online" : "Configure API Access"}
                </button>
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER PANEL */}
          <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
            
            {activeScreen === "dashboard" && (
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                {/* LEFT: MASTER CONTROL PANEL */}
                <div class="lg:col-span-8 flex flex-col gap-6">
                  
                  {/* APP TITLE CARD */}
                  <div class="p-6 rounded-2xl bg-slate-900/40 border border-slate-900/60 shadow-xl backdrop-blur relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-cyan-500/5 rounded-full filter blur-3xl pointer-events-none"></div>
                    <div class="absolute bottom-0 left-0 w-64 h-64 bg-emerald-500/5 rounded-full filter blur-3xl pointer-events-none"></div>
                    
                    <h2 class="text-3xl font-bold text-white tracking-tight mb-2">
                      Intellectual Content Distillation
                    </h2>
                    <p class="text-slate-400 text-md leading-relaxed">
                      Upload meeting transcripts, research logs, manuals, or long-form paragraphs. Deep-process them into targeted core concepts, flashcard decks, and multi-choice quizzes.
                    </p>
                  </div>

                  {/* LOADING & MOCK ADVISOR STATE */}
                  {isLoading && (
                    <div class="p-6 rounded-xl bg-cyan-950/20 border border-cyan-500/20 flex flex-col gap-3 items-center justify-center animate-pulse">
                      <div class="w-12 h-12 rounded-full border-4 border-cyan-500 border-t-transparent animate-spin"></div>
                      <p class="text-sm font-semibold text-cyan-400">{statusMsg}</p>
                    </div>
                  )}

                  {errorMsg && (
                    <div class="p-4 rounded-xl bg-rose-950/20 border border-rose-500/25 text-rose-400 text-sm flex items-center gap-3">
                      <span>⚠️</span>
                      <p>{errorMsg}</p>
                    </div>
                  )}

                  {/* WORK INPUT COMPILER */}
                  <div class="p-6 rounded-2xl bg-slate-900/40 border border-slate-900 shadow-lg flex flex-col gap-6">
                    <div class="flex justify-between items-center border-b border-slate-900 pb-4">
                      <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                        <span>⚡</span> Compile Learning Resource
                      </h3>
                      
                      {/* INPUT SELECTION tabs */}
                      <div class="flex bg-slate-950 rounded-lg p-1 text-xs font-semibold gap-1">
                        {["Text Block", "YouTube Link", "Document Info"].map((tabName, index) => (
                          <button
                            key={index}
                            onClick={() => setInputMode(index)}
                            class={`px-3 py-1.5 rounded-md transition-all ${inputMode === index ? "bg-slate-800 text-cyan-400" : "text-slate-500 hover:text-slate-300"}`}
                          >
                            {tabName}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* INPUTS CONTAINER FIELDS */}
                    <div class="flex flex-col gap-4">
                      {inputMode === 0 ? (
                        <textarea
                          placeholder="Paste historical records, research PDF articles, code documentation, meeting summaries, or detailed tutorials..."
                          value={rawText}
                          onChange={(e) => setRawText(e.target.value)}
                          class="w-full h-44 bg-slate-950 border border-slate-900 rounded-xl p-4 text-sm text-slate-200 placeholder:text-slate-700 focus:outline-none focus:ring-1 focus:ring-cyan-500/50 focus:border-cyan-505/50 transition-all font-mono"
                        />
                      ) : inputMode === 1 ? (
                        <div class="flex flex-col gap-4">
                          <div class="relative">
                            <span class="absolute left-3 top-3.5 text-rose-500 font-bold text-xs">YOUTUBE</span>
                            <input
                              type="text"
                              placeholder="https://www.youtube.com/watch?v=..."
                              value={youtubeUrl}
                              onChange={(e) => setYoutubeUrl(e.target.value)}
                              class="w-full bg-slate-950 border border-slate-900 rounded-xl py-3.5 pl-20 pr-4 text-sm text-slate-200 placeholder:text-slate-700 focus:outline-none focus:ring-1 focus:ring-rose-500/30 focus:border-rose-500/30"
                            />
                          </div>
                          <textarea
                            placeholder="Add targeted subtitle references or general topics (e.g. 'focus on cryptographic math proofs') to optimize summaries."
                            value={rawText}
                            onChange={(e) => setRawText(e.target.value)}
                            class="w-full h-24 bg-slate-950 border border-slate-900 rounded-xl p-4 text-sm text-slate-200 placeholder:text-slate-700 focus:outline-none focus:ring-1 focus:ring-cyan-500/50 focus:border-cyan-500/50"
                          />
                        </div>
                      ) : (
                        <div class="flex flex-col gap-4">
                          <input
                            type="text"
                            placeholder="Define Scientific Topic/Book Domain (e.g., 'Thermodynamics Third Law')"
                            value={docTopic}
                            onChange={(e) => setDocTopic(e.target.value)}
                            class="w-full bg-slate-950 border border-slate-900 rounded-xl p-3 text-sm text-slate-200 placeholder:text-slate-700 focus:outline-none focus:ring-1 focus:ring-cyan-500/50"
                          />
                          <textarea
                            placeholder="Furnish brief conceptual guidelines or facts supporting raw topic deconstruction (Optional)..."
                            value={rawText}
                            onChange={(e) => setRawText(e.target.value)}
                            class="w-full h-24 bg-slate-950 border border-slate-900 rounded-xl p-4 text-sm text-slate-200 placeholder:text-slate-700 focus:outline-none focus:ring-1 focus:ring-cyan-500/50"
                          />
                        </div>
                      )}

                      {/* EXTRA CONTROLS OR CHIPS SETUPS */}
                      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-950/60 p-4 rounded-xl border border-slate-900/60">
                        <div>
                          <label class="text-xs text-slate-500 font-bold uppercase tracking-wider block mb-2">Style Format</label>
                          <select 
                            value={selectedStyle}
                            onChange={(e) => setSelectedStyle(e.target.value)}
                            class="w-full bg-slate-900 border border-slate-800 text-slate-200 text-xs font-semibold rounded-lg p-2 focus:ring-1 focus:ring-cyan-500/40"
                          >
                            {["BULLET SUMMARY", "SHORT SUMMARY", "STUDENT NOTES", "BEGINNER EXPLANATION", "PROFESSIONAL", "STORY STYLE", "SOCIAL MEDIA"].map(st => (
                              <option key={st} value={st}>{st}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label class="text-xs text-slate-500 font-bold uppercase tracking-wider block mb-2">Depth Level</label>
                          <select 
                            value={selectedDifficulty}
                            onChange={(e) => setSelectedDifficulty(e.target.value)}
                            class="w-full bg-slate-900 border border-slate-800 text-slate-200 text-xs font-semibold rounded-lg p-2"
                          >
                            {["Beginner", "Intermediate", "Advanced", "Elite Specialist"].map(st => (
                              <option key={st} value={st}>{st}</option>
                            ))}
                          </select>
                        </div>

    function FlashcardsLayout({ summary }) {

              disabled={currentIndex === 0}
              class="w-12 h-12 rounded-full bg-slate-900 border border-slate-800 text-cyan-400 font-bold hover:border-cyan-500/40 disabled:opacity-30 flex items-center justify-center transition-all"

    // MCQ INTERACTIVE QUIZ BED
    function QuizLayout({ summary }) {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);
      const [quizEnded, setQuizEnded] = useState(false);

      if (!summary.quizQuestions || summary.quizQuestions.length === 0) {
        return (
          <div class="text-center py-12 text-slate-500">
            No interactive MCQ compiled for this knowledge deck.
          </div>
        );
      }

      const activeQ = summary.quizQuestions[currentIdx];

      const handleCheckAnswer = () => {
        if (selectedOpt === activeQ.correctIndex) {
          setScore(score + 1);
        }
        setSubmitted(true);
      };

      const handleNextQuestion = () => {
        if (currentIdx < summary.quizQuestions.length - 1) {
          setCurrentIdx(currentIdx + 1);
          setSelectedOpt(null);
          setSubmitted(false);
        } else {
          setQuizEnded(true);
        }
      };

      const handleResetQuiz = () => {
        setCurrentIdx(0);
        setSelectedOpt(null);
        setSubmitted(false);
        setScore(0);
        setQuizEnded(false);
      };

      if (quizEnded) {
        const scorePct = Math.round((score / summary.quizQuestions.length) * 100);
        return (
          <div class="max-w-md mx-auto text-center py-12 flex flex-col gap-6 items-center">
            <span class="text-5xl">🏆</span>
            <div>
              <h4 class="text-2xl font-bold text-white mb-2">Quiz Completed!</h4>
              <p class="text-sm text-slate-400">Your final score metrics across core questions</p>
            </div>
            
            <div class="text-4xl font-extrabold text-cyan-400 bg-slate-900 px-6 py-4 rounded-2xl border border-slate-850">
              {score} / {summary.quizQuestions.length} ({scorePct}%)
            </div>

            <p class="text-sm text-slate-400 font-medium max-w-sm">
              {scorePct >= 80 ? "Stellar deconstruction! You have absorbed all key learning parameters." : "Review suggested. Head back to the flashcards to solidify your model comprehension."}
            </p>

            <button
              onClick={handleResetQuiz}
              class="px-6 py-3 font-semibold text-sm bg-cyan-500 text-slate-950 rounded-xl hover:opacity-90 transition-all"
            >
              Replay Active Quiz
            </button>
          </div>
        );
      }

      return (
        <div class="max-w-2xl mx-auto flex flex-col gap-6">
          <div class="flex justify-between items-center">
            <h4 class="text-lg font-bold text-white">Interactive Assessment</h4>
            <span class="text-xs text-slate-500 bg-slate-900 border border-slate-800 px-3 py-1 rounded">
              Question {currentIdx + 1} of {summary.quizQuestions.length}
            </span>
          </div>

          {/* MAIN QUESTION BLOCK */}
          <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-850">
            <p class="font-bold text-md text-slate-100">{activeQ.question}</p>
          </div>

          {/* CHOOSE OPTION LIST */}
          <div class="flex flex-col gap-3">
            {activeQ.options.map((option, oIdx) => {
              const isSelected = selectedOpt === oIdx;
              const isCorrect = oIdx === activeQ.correctIndex;
              let optionClass = "border-slate-850 bg-slate-900 hover:border-slate-700 hover:bg-slate-850 text-slate-330";
              
              if (submitted) {
                if (isCorrect) optionClass = "border-emerald-500/50 bg-emerald-500/10 text-emerald-300";
                else if (isSelected) optionClass = "border-rose-500/50 bg-rose-500/10 text-rose-300";
                else optionClass = "border-slate-900 bg-slate-950/40 text-slate-600 pointer-events-none";
              } else if (isSelected) {
                optionClass = "border-cyan-500/50 bg-cyan-500/10 text-cyan-300";
              }

              return (
                <button
                  key={oIdx}
                  onClick={() => !submitted && setSelectedOpt(oIdx)}
                  disabled={submitted}
                  class={`w-full p-4 rounded-xl border flex items-center gap-4 text-left font-medium text-sm transition-all duration-200 ${optionClass}`}
                >
                  <span class="font-bold font-mono opacity-50 bg-slate-950 w-6 h-6 rounded-full flex items-center justify-center text-xs">
                    {String.fromCharCode(65 + oIdx)}
                  </span>
                  <span>{option}</span>
                </button>
              );
            })}
          </div>

          {/* CONCISE RATIONAL WRAPUP EXPLANATION */}
          {submitted && (
            <div class="p-5 rounded-2xl bg-slate-900/40 border border-slate-800 flex flex-col gap-1.5">
              <span class="text-xs text-cyan-400 font-bold uppercase tracking-wider block">Correct Rationale:</span>
              <p class="text-xs leading-relaxed text-slate-400 italic">
                {activeQ.explanation || "No extended explanation compiled for this option node."}
              </p>
            </div>
          )}

          {/* ACTIVE FOOTER CONTROLS */}
          <div class="flex justify-end mt-4">
            {!submitted ? (
              <button
                onClick={handleCheckAnswer}
                disabled={selectedOpt === null}
                class="px-6 py-3 font-semibold text-sm bg-cyan-500 text-slate-950 rounded-xl hover:opacity-95 disabled:opacity-40 transition-all flex items-center gap-1"
              >
                Submit Answer 🚀
              </button>
            ) : (
              <button
                onClick={handleNextQuestion}
                class="px-6 py-3 font-semibold text-sm bg-emerald-500 text-slate-950 rounded-xl hover:opacity-95 transition-all flex items-center gap-1"
              >
                {currentIdx < summary.quizQuestions.length - 1 ? "Next Parameter →" : "Compile Final Grade Score 🏆"}
              </button>
            )}
          </div>
        </div>
      );
    }

    // AUDIO BROADCAST NATIVE BROWSER RECITAL SPEECH SYSTEM
    function AudioNotesLayout({ summary }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const synthRef = useRef(window.speechSynthesis);

      useEffect(() => {
        return () => {
          if (synthRef.current) synthRef.current.cancel();
        };
      }, []);

      const handleToggleSpeech = () => {
        if (!synthRef.current) {
          alert("Your specific web browser does not support Web Speech synthesis synthesis rules.");
          return;
        }

        if (isPlaying) {
          synthRef.current.cancel();
          setIsPlaying(false);
        } else {
          synthRef.current.cancel();
          const spoken = `${summary.title}. Category detail: ${summary.category}. Detailed notes summary: ${summary.summaryText}. Critical key nodes: ${summary.keyPoints.join(". ")}`;
          const utterance = new SpeechSynthesisUtterance(spoken);
          
          utterance.onend = () => {
            setIsPlaying(false);
          };
          utterance.onerror = () => {
            setIsPlaying(false);
          };

          setIsPlaying(true);
          synthRef.current.speak(utterance);
        }
      };

      return (
        <div class="max-w-md mx-auto flex flex-col gap-6 items-center">
          <div class="text-center">
            <h4 class="text-lg font-bold text-white">Audio Recital Integration</h4>
            <p class="text-xs text-slate-500">Listen to deconstructed summary nodes to synchronize procedural memory paths</p>
          </div>

          {/* SLEEK SOUND viz Bouncing card */}
          <div class="w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 h-40 flex items-center justify-center">
            <div class="flex items-end justify-center h-16 gap-1.5 w-44">
              {isPlaying ? (
                <React.Fragment>
                  <div class="w-2.5 bg-cyan-400 rounded-full h-full transform origin-bottom anim-viz-1"></div>
                  <div class="w-2.5 bg-teal-400 rounded-full h-full transform origin-bottom anim-viz-2"></div>
                  <div class="w-2.5 bg-emerald-400 rounded-full h-full transform origin-bottom anim-viz-3"></div>
                  <div class="w-2.5 bg-indigo-400 rounded-full h-full transform origin-bottom anim-viz-4"></div>
                  <div class="w-2.5 bg-cyan-400 rounded-full h-full transform origin-bottom anim-viz-5"></div>
                  <div class="w-2.5 bg-teal-400 rounded-full h-full transform origin-bottom anim-viz-6"></div>
                  <div class="w-2.5 bg-emerald-400 rounded-full h-full transform origin-bottom anim-viz-7"></div>
                  <div class="w-2.5 bg-indigo-400 rounded-full h-full transform origin-bottom anim-viz-8"></div>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <div class="w-2.5 bg-slate-800 rounded-full h-3"></div>
                  <div class="w-2.5 bg-slate-800 rounded-full h-3"></div>
                  <div class="w-2.5 bg-slate-800 rounded-full h-3"></div>
                  <div class="w-2.5 bg-slate-800 rounded-full h-3"></div>
                  <div class="w-2.5 bg-slate-800 rounded-full h-3"></div>
                  <div class="w-2.5 bg-slate-800 rounded-full h-3"></div>
                  <div class="w-2.5 bg-slate-800 rounded-full h-3"></div>
                  <div class="w-2.5 bg-slate-800 rounded-full h-3"></div>
                </React.Fragment>
              )}
            </div>
          </div>

          {/* PLAY AND ACTION EXECUTORS */}
          <button
            onClick={handleToggleSpeech}
            class={`w-20 h-20 rounded-full flex items-center justify-center transition-all shadow-xl ${isPlaying ? "bg-rose-500 hover:bg-rose-600 shadow-rose-500/10" : "bg-cyan-500 hover:bg-cyan-600 shadow-cyan-500/10"}`}
          >
            {isPlaying ? (
              <span class="text-slate-950 font-bold uppercase text-xs tracking-wider">Pause</span>
            ) : (
              <span class="text-slate-950 font-bold uppercase text-xs tracking-wider">Speak</span>
            )}
          </button>

          {summary.suggestedTopics && summary.suggestedTopics.length > 0 && (
            <div class="w-full bg-slate-900/40 p-5 rounded-2xl border border-slate-850 mt-2">
              <h5 class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-3">Recommended Semantic Research Areas:</h5>
              <div class="flex flex-col gap-2">
                {summary.suggestedTopics.map((topic, index) => (
                  <div key={index} class="flex items-center gap-2 text-xs text-slate-400">
                    <span>🔍</span>
                    <span>{topic}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
